<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Excel Tab B24</title>
    <link rel="stylesheet" href="style.css?v=excel-tab-v25">
    <script src="//api.bitrix24.com/api/v1/"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Excel Tab B24 v.25</h1>
          <p id="dealContext">Загрузка карточки сделки...</p>
        </div>
        <button class="ghost-button" id="reloadFieldsButton" type="button">Обновить поля</button>
      </header>

      <section class="toolbar" aria-label="Панель таблицы">
        <button class="toolbar-button" id="selectFilledButton" type="button">Выделить всё</button>
        <button class="toolbar-button" id="autoFitButton" type="button">Автоширина колонок</button>
        <div class="selection-actions" id="selectionActions" hidden>
          <button class="toolbar-button" id="formulaLibraryButton" type="button">Добавить формулу</button>
          <button class="toolbar-button" id="clearSelectionButton" type="button">Удалить</button>
          <button class="toolbar-button" id="wrapTextButton" type="button">Переносить текст</button>
          <div class="alignment-group" role="group" aria-label="Выравнивание">
            <div class="alignment-buttons">
              <button class="icon-button align-button align-top" id="alignTopButton" type="button" aria-label="По верхнему краю" data-tooltip="По верхнему"></button>
              <button class="icon-button align-button align-middle" id="alignMiddleButton" type="button" aria-label="По середине" data-tooltip="По середине"></button>
              <button class="icon-button align-button align-bottom" id="alignBottomButton" type="button" aria-label="По нижнему краю" data-tooltip="По нижнему"></button>
              <button class="icon-button align-button align-left" id="alignLeftButton" type="button" aria-label="По левому краю" data-tooltip="По левому"></button>
              <button class="icon-button align-button align-center" id="alignCenterButton" type="button" aria-label="По центру" data-tooltip="По центру"></button>
              <button class="icon-button align-button align-right" id="alignRightButton" type="button" aria-label="По правому краю" data-tooltip="По правому"></button>
            </div>
            <div class="alignment-caption">Выравнивание</div>
          </div>
          <div class="toolbar-group" aria-label="Формат">
            <button class="icon-button strong-button" id="boldButton" type="button" title="Жирный шрифт">B</button>
            <button class="icon-button italic-button" id="italicButton" type="button" title="Курсив">I</button>
            <select class="toolbar-select" id="fontSizeSelect" aria-label="Кегль шрифта">
              <option value="13pt">13 пт</option>
              <option value="11pt">11 пт</option>
              <option value="15pt">15 пт</option>
              <option value="18pt">18 пт</option>
            </select>
            <select class="toolbar-select" id="fillColorSelect" aria-label="Цвет заливки">
              <option value="">Без заливки</option>
              <option value="#fff2cc">Желтый</option>
              <option value="#d9ead3">Зеленый</option>
              <option value="#cfe2f3">Голубой</option>
              <option value="#f4cccc">Красный</option>
              <option value="#eadcf8">Фиолетовый</option>
            </select>
          </div>
        </div>
        <button class="toolbar-button" id="exportExcelButton" type="button">Экспорт в Excel</button>
        <div class="status-pill" id="fieldStatus">Поля сделки: ожидание</div>
        <div class="status-pill" id="gridStatus">9 строк, 7 столбцов</div>
      </section>

      <section class="grid-frame" aria-label="Таблица сделки">
        <div class="grid-scroll">
          <table class="sheet" id="sheet" aria-label="Редактируемая таблица"></table>
        </div>
        <button class="add-column-button" id="addColumnButton" type="button" aria-label="Добавить столбец">+</button>
        <button class="add-row-button" id="addRowButton" type="button" aria-label="Добавить строку">+</button>
      </section>
      <nav class="sheet-switcher" aria-label="Листы таблицы">
        <button class="sheet-switch-button is-active" id="dealSheetButton" type="button" aria-pressed="true">Эта сделка</button>
        <button class="sheet-switch-button" id="funnelSheetButton" type="button" aria-pressed="false" disabled>Таблица всех сделок воронки</button>
      </nav>
    </main>

    <template id="cellTemplate">
      <div class="cell-wrap">
        <textarea class="cell-input" rows="1" autocomplete="off" aria-label="Значение ячейки"></textarea>
        <button class="field-picker-button" type="button" aria-label="Выбрать поле сделки">▾</button>
      </div>
    </template>

    <div class="field-popover" id="fieldPopover" hidden>
      <div class="field-popover-header">
        <input class="field-search" id="fieldSearch" type="search" placeholder="Найти поле" autocomplete="off">
        <button class="field-popover-close" id="fieldPopoverClose" type="button" aria-label="Закрыть список полей">×</button>
      </div>
      <div class="field-list" id="fieldList"></div>
    </div>

    <div class="formula-suggestions" id="formulaSuggestions" hidden></div>

    <div class="modal-backdrop" id="formulaModal" hidden role="dialog" aria-modal="true" aria-labelledby="formulaModalTitle">
      <section class="formula-modal">
        <header class="formula-modal-header">
          <h2 id="formulaModalTitle">Сохранённые формулы</h2>
          <button class="modal-close-button" id="formulaModalClose" type="button" aria-label="Закрыть окно">×</button>
        </header>
        <div class="formula-modal-body">
          <section class="formula-list-panel" aria-label="Список сохранённых формул">
            <div class="formula-list" id="formulaList"></div>
          </section>
          <section class="formula-save-panel" aria-label="Сохранение формулы">
            <label class="formula-input-label" for="formulaInput">Формула</label>
            <textarea class="formula-input" id="formulaInput" rows="4" autocomplete="off" spellcheck="false" placeholder="=A1+B1"></textarea>
            <button class="toolbar-button" id="saveFormulaButton" type="button">Сохранить формулу</button>
            <div class="formula-modal-status" id="formulaModalStatus" aria-live="polite"></div>
          </section>
        </div>
        <footer class="formula-modal-footer">
          <button class="toolbar-button" id="applyFormulaButton" type="button">Применить к ячейке</button>
          <button class="toolbar-button" id="cancelFormulaButton" type="button">Отмена</button>
        </footer>
      </section>
    </div>

    <div class="modal-backdrop" id="deleteConfirmModal" hidden role="dialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
      <section class="confirm-modal">
        <header class="formula-modal-header">
          <h2 id="deleteConfirmTitle">Вы действительно хотите удалить?</h2>
          <button class="modal-close-button" id="deleteConfirmClose" type="button" aria-label="Закрыть окно">×</button>
        </header>
        <div class="confirm-modal-body">
          Выделенные ячейки будут очищены вместе с данными, заливкой и форматированием.
        </div>
        <footer class="formula-modal-footer">
          <button class="toolbar-button" id="confirmDeleteButton" type="button">Да, удалить</button>
          <button class="toolbar-button" id="cancelDeleteButton" type="button">Отменить удаление</button>
        </footer>
      </section>
    </div>

    <script src="app.js?v=excel-tab-v25"></script>
  </body>
</html>
